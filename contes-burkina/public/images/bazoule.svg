  <!-- NÃ©nuphars et flore aquatique de la mare -->
  <ellipse cx="160" cy="440" rx="22" ry="9" fill="#2d6e4b"/>
  <ellipse cx="230" cy="460" rx="18" ry="7" fill="#2d6e4b"/>
  <circle cx="232" cy="458" r="3" fill="#fcd253"/>

  <!-- Titre et sous-titre gravÃ©s -->
  <text x="50" y="70" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#fff6e4" letter-spacing="2">LES CROCODILES DE BAZOULÉ</text>
  <text x="50" y="95" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffd066" letter-spacing="4">LE PACTE DE L'EAU · KOOM LAKRÉ</text>
