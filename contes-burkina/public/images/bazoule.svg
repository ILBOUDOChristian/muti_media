  </defs>

  <!-- Ciel de fin de journÃ©e de savane -->
  <rect width="800" height="500" fill="url(#oasisSky)"/>

  <!-- Soleil chaud rasant -->
  <circle cx="220" cy="230" r="130" fill="#fcd97d" opacity="0.35"/>
