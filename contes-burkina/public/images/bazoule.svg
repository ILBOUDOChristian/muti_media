    <ellipse cx="85" cy="20" rx="50" ry="20" fill="#22110a"/>
  </g>

  <!-- Berges en terre d'argile et d'ocre -->
  <path d="M0,350 Q260,320 500,360 T800,340 L800,500 L0,500 Z" fill="url(#clayBank)"/>

  <!-- Mare d'eau sacrÃ©e oÃ¹ vivent les crocodiles en libertÃ© -->
  <ellipse cx="320" cy="425" rx="360" ry="90" fill="url(#waterOasis)"/>
  <ellipse cx="320" cy="425" rx="300" ry="70" fill="#4d998c" opacity="0.25"/>

  <!-- Crocodile sacrÃ© du Nil reposant en confiance sur la berge -->
  <g transform="translate(340, 360)">
