    <path d="M100,40 C108,55 125,58 132,50 C125,42 118,40 110,40 Z" fill="#1e2c14"/>

    <!-- TÃªte et museau puissant tournÃ© vers la lumiÃ¨re -->
    <path d="M140,20 C175,22 215,26 230,32 C225,40 195,45 155,42 C145,35 140,25 140,20 Z" fill="url(#crocSkin)"/>
    <!-- Å’il paisible (sans agressivitÃ©) -->
