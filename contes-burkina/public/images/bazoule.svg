    <path d="M-190,45 C-140,40 -80,25 -20,20 C-10,32 -60,42 -120,48 C-160,52 -185,50 -190,45 Z" fill="#243418"/>
    <!-- CrÃªte dorsale crÃ©nelÃ©e sur la queue -->
    <polygon points="-160,42 -155,34 -150,42" fill="#1b2812"/>
    <polygon points="-135,38 -130,30 -125,38" fill="#1b2812"/>
    <polygon points="-110,34 -105,25 -100,34" fill="#1b2812"/>
    <polygon points="-85,30 -80,20 -75,30" fill="#1b2812"/>
    <polygon points="-60,26 -55,16 -50,26" fill="#1b2812"/>

    <!-- Corps massif et cuirassÃ© -->
    <path d="M-30,18 C10,12 80,10 140,20 C155,38 120,48 50,48 C-10,48 -25,32 -30,18 Z" fill="url(#crocSkin)"/>

    <!-- Plaques dorsales osseuses (Ã©cailles protectrices) -->
    <g fill="#1b2812">
      <polygon points="-10,18 -5,8 0,18"/>
      <polygon points="15,16 20,6 25,16"/>
      <polygon points="40,15 45,5 50,15"/>
