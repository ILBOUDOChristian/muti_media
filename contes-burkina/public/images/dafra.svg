<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="canyonSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12181d"/>
      <stop offset="50%" stop-color="#24383a"/>
      <stop offset="100%" stop-color="#3d635c"/>
    </linearGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c1a14"/>
      <stop offset="45%" stop-color="#5a2d1d"/>
      <stop offset="100%" stop-color="#3a1e14"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#194852"/>
      <stop offset="40%" stop-color="#206975"/>
      <stop offset="100%" stop-color="#0e3037"/>
    </linearGradient>
    <radialGradient id="waterRipple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee2d8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#206975" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0e3037" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fishSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#353b3f"/>
      <stop offset="50%" stop-color="#1b2024"/>
      <stop offset="100%" stop-color="#0a0d0f"/>
    </linearGradient>
  </defs>

  <!-- Ciel de la gorge rocheuse -->
  <rect width="800" height="500" fill="url(#canyonSky)"/>

  <!-- Falaises de grÃ¨s du sanctuaire de Dafra (parois abruptes) -->
  <path d="M0,0 L240,0 L200,120 L260,240 L170,360 L230,500 L0,500 Z" fill="url(#rockGrad)"/>
  <path d="M800,0 L570,0 L610,130 L550,260 L630,370 L580,500 L800,500 Z" fill="url(#rockGrad)"/>
  
  <!-- Strates rocheuses et reliefs gÃ©ologiques -->
  <path d="M0,80 L210,100 L180,180 L240,280 L0,320 Z" fill="#20110c" opacity="0.6"/>
  <path d="M800,90 L590,110 L620,200 L560,300 L800,340 Z" fill="#1c0f0a" opacity="0.6"/>

  <!-- Source d'eau sacrÃ©e du marigot Houet -->
  <ellipse cx="400" cy="380" rx="280" ry="105" fill="url(#waterGrad)"/>
  <ellipse cx="400" cy="380" rx="220" ry="75" fill="url(#waterRipple)"/>

  <!-- Ronds dans l'eau sacrÃ©e -->
  <ellipse cx="380" cy="360" rx="140" ry="45" fill="none" stroke="#68d5ca" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="420" cy="390" rx="90" ry="30" fill="none" stroke="#68d5ca" stroke-width="1.2" opacity="0.3"/>

  <!-- Grand Silure SacrÃ© 1 (AncÃªtre tutÃ©laire de Sya) -->
  <g transform="translate(320, 310) rotate(-12)">
    <!-- Corps fuselÃ© -->
    <path d="M-60,40 C-30,10 40,5 120,25 C160,35 190,55 210,60 C170,68 120,65 60,62 C-10,60 -45,55 -60,40 Z" fill="url(#fishSkin)"/>
    <!-- TÃªte aplatie caractÃ©ristique du silure -->
    <path d="M-60,40 C-80,42 -95,52 -85,62 C-70,70 -50,65 -35,62 Z" fill="#15191c"/>
    <!-- Nageoires pectorales -->
    <path d="M-30,30 C-40,10 -25,-5 -15,15 Z" fill="#20272b"/>
    <path d="M-20,62 C-28,82 -10,88 -5,68 Z" fill="#1b2125"/>
    <!-- Nageoire caudale (queue souple) -->
    <path d="M210,60 C235,45 250,55 240,70 C230,80 215,75 205,65 Z" fill="#151a1d"/>
    <!-- Barbillons lÃ©gendaires (moustaches sensorielles sacrÃ©es) -->
    <path d="M-85,50 C-115,35 -145,50 -160,70" stroke="#a0b8bc" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M-80,62 C-105,75 -135,80 -150,95" stroke="#8fa9ad" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Cauris protecteurs incrustÃ©s selon la lÃ©gende -->
    <ellipse cx="20" cy="35" rx="5" ry="3.5" fill="#f8f4ec" stroke="#c4a572" stroke-width="1"/>
    <ellipse cx="60" cy="38" rx="4.5" ry="3" fill="#f8f4ec" stroke="#c4a572" stroke-width="1"/>
    <ellipse cx="100" cy="42" rx="4" ry="2.8" fill="#f8f4ec" stroke="#c4a572" stroke-width="1"/>
  </g>

  <!-- DeuxiÃ¨me silure plus discret au second plan -->
  <g transform="translate(430, 400) scale(0.68) rotate(165)">
    <path d="M-50,30 C-20,10 40,8 100,25 C140,35 170,50 185,55 C150,62 100,58 50,55 C0,52 -35,45 -50,30 Z" fill="#181e22" opacity="0.85"/>
    <path d="M-75,40 C-95,30 -120,40 -130,55" stroke="#758f94" stroke-width="1.8" fill="none" opacity="0.7"/>
    <path d="M-70,50 C-90,60 -115,65 -125,75" stroke="#758f94" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- Pierres de l'autel sacrificiel aux abords de l'eau -->
  <polygon points="260,420 310,405 340,430 290,445" fill="#3c2217"/>
  <polygon points="295,400 325,392 340,408 310,418" fill="#522f21"/>
  <!-- Flamme / offrande rituelle timide -->
  <circle cx="318" cy="392" r="3" fill="#ff7733"/>

  <!-- Titre et sous-titre gravÃ©s -->
  <text x="50" y="70" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#e5f5f3" letter-spacing="2">LES SILURES DE DAFRA</text>
  <text x="50" y="95" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#6fe0d3" letter-spacing="4">SANCTUAIRE DES ANCÊTRES · BOBO-DIOULASSO</text>
</svg>

